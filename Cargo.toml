[package]
name = "ripfuzz"
description = "An extremely fast Smart contract fuzzer."
version = "0.9.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/pyk/ripfuzz"
exclude = ["/fixtures", "/.agents", "/.github"]

[lib]
name = "ripfuzz"
path = "src/lib.rs"

[dependencies]
# Error handling
anyhow = "1.0.100"

# CLI
clap = { version = "4.5.54", features = ["derive"] }

# Logging & Tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# JSON & TOML
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
toml = "1.1.2"

# RNG
fastrand = "2"

# Date/time formatting
jiff = "0.2.28"

# EVM
revm = { version = "38.0.0", features = [
  "optional_balance_check",
  "optional_eip3607",
  "optional_no_base_fee",
] }

# Hex decoding for foundry artifacts
hex = "0.4.3"

# SHA-256 for solc binary verification
sha2 = "0.10"

# EVM stuff
alloy-chains = "0.2"
alloy-hardforks = "0.4"
alloy-op-hardforks = "0.5"
alloy-json-abi = "1.6.0"
alloy-dyn-abi = "1.6.0"
alloy-primitives = "1.6.0"
alloy-sol-types = "1.6.0"
alloy-sol-macro = "1.6.0"

# Crypto (wallet cheatcodes)
k256 = { version = "0.13", features = ["ecdsa"] }

# Corpus file naming
uuid = { version = "1", features = ["v4"] }

# HTTP client
ureq = "3.3.0"

# Solidity compiler bindings
solc = "0.3.5"

# Extract function selectors and arguments from EVM bytecode
evmole = "0.9.3"

# Parallel processing
rayon = "1.12"
parking_lot = "0.12"
papaya = "0.2.4"

# Path traversal
walkdir = "2"

# .env support
dotenvy = "0.15.7"

[dev-dependencies]
# Test utilities
serial_test = "=3.4.0"
tempfile = "3"
