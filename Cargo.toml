[package]
name = "raptor"
description = "Parallelized, coverage-guided, mutational Solidity smart contract fuzzing, powered by LibAFL and revm."
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/pyk/raptor"

[[bin]]
name = "raptor"
path = "src/main.rs"

[dependencies]
# Error handling
anyhow = "1.0.100"

# CLI
clap = { version="4.5.54", features = ["derive"] }
clap-verbosity-flag = { version="3.0.4", features = ["tracing"] }

# Logging & Tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# JSON Stuff
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
